knowledgeModelVersion: 0.3.12
terms:
  - id: term.workshop
    name: 车间
    definition: 在同一租户内独立维护、不采用业务版本管理的工厂建模主数据；字段为车间编码、车间名称、描述和启用或停用状态，供产线及后续生产业务引用。
    aliases: [车间主数据, Workshop]
    status: implemented
    visibility: internal
  - id: term.production-line
    name: 产线
    definition: 隶属于一个车间的生产组织单元；现有持久化关系通过 workshop_id 引用车间。
    aliases: [生产线, Production Line]
    status: implemented
    visibility: internal
  - id: term.material
    name: 物料
    definition: 物料管理维护的主数据；类型为产品（产成品）或半成品时可以派生为产品。
    aliases: [物料主数据]
    status: implemented
    visibility: internal
  - id: term.product
    name: 产品
    definition: 从产品或半成品物料派生的生产对象，不独立维护重复的产品主数据。
    aliases: [父产品, 产品物料]
    status: implemented
    visibility: internal
  - id: term.product-family
    name: 产品簇
    definition: 可包含多个半成品或产成品产品的产品集合；成员关系已持久化，并在同一租户内约束一个产品最多属于一个产品簇。
    aliases: [产品族]
    status: implemented
    visibility: internal
  - id: term.product-process-version
    name: 产品制程版本
    definition: 产品或产品簇下可并行存在并在后续生产执行中被显式选择的具体制程配置；制程根以 owner_type 和 owner_id 标识产品或产品簇所有者，并共用同一套版本及工序表单文档绑定模型。
    aliases: [制程配置版本, 产品工艺版本, 产品簇制程版本]
    status: implemented
    visibility: internal
  - id: term.route-version
    name: 工艺路线版本
    definition: 受版本控制并包含工序节点的工艺路线定义。
    aliases: [路线版本]
    status: implemented
    visibility: internal
  - id: term.operation
    name: 工序
    definition: 工艺路线版本中的执行节点，是表单和文档绑定的业务位置。
    aliases: [工序节点, 路线节点]
    status: implemented
    visibility: internal
  - id: term.dhr-template-version
    name: DHR 模板版本
    definition: 受版本控制的 DHR 目录定义，由产品制程版本绑定。
    aliases: [批记录模板版本, DHR 版本]
    status: implemented
    visibility: internal
  - id: term.dhr-directory-item
    name: DHR 目录项
    definition: DHR 模板版本目录中的表单项，指向一个具体表单模板版本。
    aliases: [DHR 表单目录项, 批记录目录项]
    status: implemented
    visibility: internal
  - id: term.form-template-version
    name: 表单模板版本
    definition: DHR 目录项实际引用并由工序绑定追溯的受控表单版本；用户可见的生效状态由 effectiveFrom/effectiveTo 时间窗计算，持久化 status 不替代该状态。
    aliases: [表单版本]
    status: implemented
    visibility: internal
  - id: term.form-process-template
    name: 表单流程模板
    definition: 可复用的表单流程结构定义，不绑定具体表单；包含填报阶段、审批节点、结束流转、可选的主体来源规则及主体的默认字段权限。未配置填报或审批主体时，操作范围默认为当前单租户内所有已认证用户。流程模板不定义具体表单字段。
    aliases: [表单流程定义, 表单审批流程模板]
    status: specified
    visibility: internal
  - id: term.form-process-template-version
    name: 表单流程模板版本
    definition: 表单流程模板的受控配置版本，保存流程节点、连线、可选的填报或审批主体来源规则及每个主体的默认权限；未发布版本不得作为作业节点绑定目标，发布后版本内容固定。主体未配置时不展开全量用户，按开放操作范围处理。
    aliases: [表单流程版本]
    status: specified
    visibility: internal
  - id: term.form-process-binding-version
    name: 表单流程绑定版本
    definition: 作业流程表单填写节点将一个已发布表单流程版本绑定到一个表单模板版本形成的配置快照；绑定可保存针对真实表单字段的例外权限，并由节点固定引用。
    aliases: [表单流程绑定, 表单流程配置版本]
    status: specified
    visibility: internal
  - id: term.form-process-version-reference
    name: 表单流程版本引用
    definition: 作业流程版本的表单填报节点对某个已发布表单流程版本的固定配置引用；引用随所属作业流程版本冻结，不因表单流程后续升版自动改变。
    aliases: [流程版本引用, 表单流程引用]
    status: implemented
    visibility: internal
  - id: term.form-process-version-usage-projection
    name: 表单流程版本使用投影
    definition: 从作业流程图节点配置派生的可查询引用关系，用于在表单流程侧查看哪些作业流程版本正在使用某流程版本；投影由保存作业流程图时重建，不是独立维护的业务事实来源。
    aliases: [流程使用情况, 版本引用投影]
    status: implemented
    visibility: internal
  - id: term.form-process-field-slot
    name: 表单流程字段槽位
    definition: 历史方案中表单流程模板内代表稳定业务含义的字段契约；当前方案不再创建或配置该对象，仅保留用于读取历史配置和追溯旧决策。
    aliases: [字段槽位, 流程字段契约]
    status: deprecated
    visibility: internal
  - id: term.form-process-field-mapping
    name: 表单流程字段映射
    definition: 在绑定版本中将流程字段槽位映射到所选表单模板版本实际字段的配置记录；发布前需校验映射的存在性和兼容性。
    aliases: [字段槽位映射, 表单字段映射]
    status: deprecated
    visibility: internal
  - id: term.form-entry-permission-group
    name: 表单填报权限组
    definition: 填报阶段按岗位、角色或用户组授予字段编辑或只读及保存、提交等操作权限的主体；同一表单可配置多个权限组。
    aliases: [填报权限组, 表单录入权限组]
    status: deprecated
    visibility: internal
  - id: term.form-process-participant-rule
    name: 表单流程参与者规则
    definition: 表单流程审批节点解析处理人的规则，支持固定用户、部门负责人、角色或用户组、业务责任人等来源。
    aliases: [审批人规则, 审批参与者规则]
    status: specified
    visibility: internal
  - id: term.form-process-subject
    name: 表单流程主体
    definition: 表单流程节点上可选配置的填报人或审批参与者来源；多个主体可被放入同一个权限配置组，由组统一设置字段权限。未配置主体不代表无人可操作，而代表在当前单租户内对已认证用户开放对应操作。
    aliases: [填报主体, 审批主体, 表单流程参与主体]
    status: specified
    visibility: internal
  - id: term.identity-user-subject
    name: 用户主体
    definition: 由 UserAccount 稳定标识的流程主体，可直接作为审批主体或填报权限主体；主体引用保存用户 ID，不以显示名称作为唯一身份。
    aliases: [用户, 固定用户]
    status: implemented
    visibility: internal
  - id: term.identity-department-subject
    name: 部门主体
    definition: 由 Department 稳定标识的流程主体；部门范围默认为本部门及下级，也可选择仅本部门，具体成员按最新组织关系解析。
    aliases: [组织主体, 部门人员范围]
    status: implemented
    visibility: internal
  - id: term.identity-role-subject
    name: 角色主体
    definition: 由 Role 稳定标识的流程主体；当前产品页面将 Role 展示为岗位角色，具体成员按最新用户-角色关系解析，不另建独立岗位维度。
    aliases: [岗位角色, 角色]
    status: implemented
    visibility: internal
  - id: term.identity-runtime-subject-resolution
    name: 运行时主体解析
    definition: 在流程节点或其他业务调用时，使用当前有效的用户、部门和角色关系，将标准主体引用展开为最终用户集合；同一用户只保留一个解析结果，同时保留其命中的全部主体来源供权限合并、通知或审计使用。
    aliases: [主体解析器, 人员解析, 运行时人员解析]
    status: specified
    visibility: internal
  - id: term.identity-subject-resolution-match
    name: 主体解析命中
    definition: 运行时主体解析中某个最终用户与一个主体引用的匹配记录，包含主体类型、主体标识、部门范围（如适用）及用户标识；多个命中记录不得被去重逻辑丢弃。
    aliases: [解析来源, 主体命中来源]
    status: specified
    visibility: internal
  - id: term.workflow-task
    name: 逻辑工作流任务
    definition: 一个流程节点在运行时创建的单个逻辑待办任务；配置主体时多候选用户通过候选快照关联到同一任务，任一候选完成后任务完成；未配置审批主体时仍只创建一条逻辑任务，并由开放操作范围决定已认证用户的处理资格。
    aliases: [工作流任务, workflow_task]
    status: specified
    visibility: internal
  - id: term.workflow-task-resolution-snapshot
    name: 工作流任务主体解析快照
    definition: 工作流任务创建时保存的候选用户集合及主体命中来源快照，用于审计并冻结既有任务的候选范围，不随后续组织关系变化重算。
    aliases: [任务候选快照, 主体解析快照]
    status: specified
    visibility: internal
  - id: term.form-process-subject-selector
    name: 表单流程公共主体选择器
    definition: 在审批主体和填报权限主体等配置场景复用的主体选择组件；第一版支持用户、部门和角色，并保存稳定主体引用及部门范围。
    aliases: [主体选择器, 人员选择器]
    status: specified
    visibility: internal
  - id: term.form-process-subject-default-permission
    name: 主体默认字段权限
    definition: 表单流程权限配置组设置的统一字段权限，第一版只有全部可编辑和全部只读两种选择；填报组内多个主体或审批节点内多个主体共享该默认权限，未配置字段例外时直接作为组内主体的字段权限。
    aliases: [默认权限, 主体默认权限]
    status: specified
    visibility: internal
  - id: term.form-process-permission-group
    name: 表单流程权限配置组
    definition: 表单流程中统一设置字段权限的配置单元。填报阶段一个权限组可包含多个用户、部门或角色主体；审批阶段每个审批节点本身就是一个权限组，节点内多个审批主体共享该组权限。组权限包括全部可编辑或全部只读的默认权限，以及绑定具体表单后的字段例外。
    aliases: [流程权限组, 填报权限组, 审批节点权限组]
    status: specified
    visibility: internal
  - id: term.form-template-field
    name: 表单真实字段
    definition: 某个表单模板版本中实际存在并具有稳定 fieldId 的字段；字段例外权限只能引用该字段，不跨表单共享字段身份。
    aliases: [表单字段, 真实表单字段]
    status: specified
    visibility: internal
  - id: term.form-binding-field-permission-exception
    name: 表单绑定字段例外权限
    definition: 在作业流程表单填写节点绑定具体表单模板版本后，针对该表单真实字段将主体默认权限改为编辑或只读的配置；每个绑定独立保存，未配置例外时继承主体默认权限。
    aliases: [字段例外权限, 表单字段权限例外]
    status: specified
    visibility: internal
  - id: term.form-process-field-permission-policy
    name: 表单流程字段权限策略
    definition: 针对填报权限组或审批节点参与者设置字段权限的规则；每个主体先设置默认权限，再按流程字段配置少量例外，第一版权限只有编辑和只读，多个策略冲突时只读优先。
    aliases: [字段权限规则, 表单字段权限]
    status: deprecated
    visibility: internal
  - id: term.form-process-operation-permission-policy
    name: 表单流程操作权限策略
    definition: 针对表单流程主体授予保存、提交、审批、退回、终止等流程动作的配置策略；它不承载具体字段权限，字段默认权限和例外权限由主体及绑定配置分别决定。
    aliases: [操作权限规则, 表单操作权限]
    status: specified
    visibility: internal
  - id: term.form-process-node-button-config
    name: 表单流程节点按钮配置
    definition: 表单流程版本中针对开始或审批节点保存的按钮显示状态、显示名称和标准动作；电子签名通过独立签署事件关联按钮，不单独配置启用状态，已发布版本只读。
    aliases: [节点按钮配置, 流程按钮]
    status: specified
    visibility: internal
  - id: term.form-process-button-electronic-signature
    name: 表单流程按钮签署事件
    definition: 关联保存、提交、审批或退回按钮的账户密码签署事件；事件存在即表示动作执行前需要签名，是否填充签名字段由事件单独选择，当前仅定义配置层。
    aliases: [按钮签名要求, 电子签名配置]
    status: specified
    visibility: internal
  - id: term.form-process-standard-action
    name: 表单流程标准动作
    definition: 表单流程节点按钮可引用的受控动作标识；第一版仅支持保存、提交、审批和退回，转交、加签、拒绝、终止、撤回不在开放范围内。
    aliases: [标准动作, 流程动作]
    status: specified
    visibility: internal
  - id: term.form-process-node-event-config
    name: 表单流程节点事件配置
    definition: 表单流程节点在标准动作执行前或执行后保存的事件声明，包含事件时机、关联动作和受控内置事件类型；第一版只持久化配置，不代表运行时事件执行已实现。
    aliases: [节点事件, 按钮事件配置]
    status: specified
    visibility: internal
  - id: term.form-process-builtin-event
    name: 表单流程内置事件
    definition: 表单流程节点事件可选择的产品内置标准事件；第一版仅支持“填充签名字段”（FILL_SIGN_FIELD），事件声明保存在可复用表单流程版本中，不包含处理标识等技术字段。
    aliases: [内置事件, 填充签名字段事件]
    status: specified
    visibility: internal
  - id: term.production-work-form-event-field-binding
    name: 作业节点事件字段绑定
    definition: 作业流程表单填写节点选定表单模板版本后，将表单流程内置事件绑定到该表单真实稳定 fieldId 的配置；绑定只属于当前作业节点，不回写可复用表单流程版本。
    aliases: [事件字段绑定, 签名字段绑定]
    status: specified
    visibility: internal
  - id: term.rdo-effective-status
    name: RDO 版本当前生效状态
    definition: 版本化业务对象在查询时由 effectiveFrom/effectiveTo 时间窗计算出的用户可见状态；生效时间为空或已到且未超过失效时间时为 ACTIVE，未来生效或已失效时为 EXPIRED，持久化生命周期 status 不参与该投影或引用判断。
    aliases: [版本生效状态, 当前生效状态]
    status: implemented
    visibility: internal
  - id: term.document-version
    name: 文档版本
    definition: 可按任意受控文档分类绑定到工序的具体文档版本，不限于 SOP。
    aliases: [受控文档版本, SOP 文档版本]
    status: implemented
    visibility: internal
  - id: term.operation-binding
    name: 工序绑定
    definition: 产品制程版本中将路线工序节点与 DHR 目录表单及文档版本关联的配置事实。
    aliases: [工序配置, 工序资源绑定]
    status: implemented
    visibility: internal
  - id: term.production-batch
    name: 生产批次
    definition: 工单拆分形成的生产对象在 BATCH 生产形态下的业务称谓；对象保存工单、产品制程版本、对象编号、目标数量、计划起止时间、备注及独立的良品、NG 和报废数量，并规划复用 CREATED、IN_PROGRESS、COMPLETED、EARLY_TERMINATED、CANCELLED 生命周期。完整制程执行快照仍属于后续能力。
    aliases: [生产对象, 批次, SN, 工单批次]
    status: specified
    visibility: internal
  - id: term.execution-snapshot
    name: 执行快照
    definition: 未来生产对象或作业实例创建时保存的版本化执行依据。制程执行快照冻结产品、产品簇、所选制程版本及其配置；作业执行快照冻结作业模板、已发布作业流程版本、命中的作业适用规则快照和作业流程配置快照，用于保证后续配置变更不改写历史执行语义。
    aliases: [制程执行快照, 批次执行快照, 作业执行快照]
    status: specified
    visibility: internal
  - id: term.business-rule-runtime
    name: 业务规则运行引擎
    definition: 读取已发布且具备执行契约的结构化规则，对业务事件和事实进行确定性判断并返回允许、阻断或触发结果的运行组件。
    aliases: [规则运行引擎, 本体业务规则运行引擎]
    status: specified
    visibility: internal
  - id: term.transaction-orchestration
    name: 事务编排
    definition: 已废弃的生产业务术语；其原有关于定义、实例、节点、流程推进和动作处理器的业务语义由生产作业及其编排继承。它不指代数据库或框架 transaction。
    aliases: [自定义事务编排, 事务流程编排]
    status: deprecated
    visibility: internal
  - id: term.production-work
    name: 生产作业
    definition: 可被触发并按作业步骤执行的受控生产业务单元，例如清场作业、上料作业；由作业模板、流程版本、实例、步骤与受控动作组成，可被编排、审计和冻结。它是 eDHR 的生产业务术语，不是数据库或框架 transaction；当前仅确认作业骨架和定义身份，不能据此声称作业运行时已经完成。
    aliases: [作业]
    status: specified
    visibility: internal
  - id: term.production-work-definition
    name: 生产作业定义
    definition: 生产作业的可配置模板载体，持久化为 workflow_definition 中 type 为 WORK 的定义，包含名称、编码、描述、流程配置和适用规则。作业模板不以父子业务版本管理；其流程配置单独形成流程版本。删除模板时只以是否存在作业适用规则作为业务阻断条件：有规则禁止删除，无规则则连同草稿、历史和当前已发布流程配置一起删除。不复用旧 TRANSACTION 类型作为对外兼容层；仅本机开发数据库通过新的 Liquibase 迁移归一旧值。
    aliases: [作业模板, WORK 作业定义]
    status: specified
    visibility: internal
  - id: term.production-work-flow-version
    name: 作业流程版本
    definition: 属于一个作业模板的流程配置版本，保存作业节点和连线，可处于草稿、已发布或历史状态。草稿可以编辑和保存，但草稿与已发布流程版本均不可单独删除；删除作业模板时才由系统按适用规则删除门禁统一清理其流程版本。新建作业模板首次进入流程配置时前端临时显示含开始和结束边界节点的 V1 草稿，保存或发布后才落库；临时或首次持久化草稿默认不在开始和结束节点之间创建连线。每个作业模板同一时刻最多保留一个可编辑草稿。首版草稿入口支持表单填写和条件分支节点及其定义；条件节点使用有序 conditionBranches 和唯一 conditionDefaultBranch 配置，每个条件分支独立保存 all/any/not/clause AST、字段目录版本和字段显示快照。条件节点允许多个出口，但每个条件分支和否则分支最多一条线；普通节点和开始节点仍最多一条出口，不支持并行节点。发布后该版本成为当前已发布流程且不可编辑，系统自动创建继承其配置的下一草稿。历史已发布版本可覆盖当前草稿；若不存在草稿，则复制操作创建继承该历史版本配置的下一号草稿。复制不改变已发布历史；当前已发布流程版本是该作业模板对外可用的流程。保存失败不得改变上一次成功保存的版本状态或流程图。已有消息通知和人工确认节点可被画布兼容读取和配置，但不是首版新增入口。节点运行、消息发送、人工任务、条件求值和条件推进不属于当前配置能力。
    aliases: [作业流程版本, 流程版本]
    status: specified
    visibility: internal
  - id: term.production-work-flow-node
    name: 作业流程节点
    definition: 作业流程版本中的图节点配置，表示开始、结束、表单填写或条件节点等流程位置；节点之间的连线属于流程配置关系，不代表生产运行时节点实例或执行状态已经实现。
    aliases: [流程节点, 作业节点]
    status: specified
    visibility: internal
  - id: term.production-work-form-node-business-document-reference
    name: 作业流程业务单据节点引用
    definition: 作业流程表单填写节点面向配置用户展示的业务单据引用；节点内部仍通过 formTemplateVersionId 引用既有表单模板版本，业务单据称谓仅作用于该节点配置界面，不替代表单主数据模块的技术术语。
    aliases: [业务单据引用, 表单填写节点业务单据]
    status: specified
    visibility: internal
  - id: term.production-work-condition-rule
    name: 作业条件规则
    definition: 条件分支通过公用条件规则构建器配置的结构化条件表达式，使用 all、any、not 分组和 clause 条件节点表达且、或、非及嵌套条件。第一版作业适配器开放 workType、triggerType、sourceType、sourceNumber、executionStatus 五个 string 运行上下文字段，目录版本为 work-runtime-fields-v1，支持 equals、not-equals、contains、starts-with、in、is-present、is-null；in 的值为数组。每个条件分支独立保存 conditionRule、字段目录版本和字段显示快照，条件节点另有唯一 conditionDefaultBranch。当前仅有配置层 AST 和分支模型校验证据，运行时真实来源、求值、节点推进和实例快照绑定仍未实现。
    aliases: [条件规则, 条件规则 AST, 作业条件 AST]
    status: implemented
    visibility: internal
  - id: term.production-work-condition-node
    name: 作业条件节点
    definition: 作业流程中根据有序条件分支选择后续出口的节点配置；包含一个或多个条件分支以及唯一的否则默认分支。画布配置以纵向主流程展开，条件节点通过统一入口接收入边，分支出口只允许向后续流程节点出边。它描述流程配置语义，不代表运行时求值或节点推进已实现。
    aliases: [条件节点, 条件分支节点]
    status: specified
    visibility: internal
  - id: term.production-work-condition-branch
    name: 作业条件分支
    definition: 条件节点中按数组顺序排列的单个条件分支；每个分支独立保存结构化条件 AST、字段目录版本和字段显示快照，按纵向主流程展示，并拥有最多一条只能向后续流程节点输出的动态出口。出口支持画布快捷添加后续节点并自动连线；运行时应按顺序命中第一个满足分支，当前求值尚未实现。纵向间距和避免节点覆盖属于配置交互层推断。
    aliases: [条件分支]
    status: specified
    visibility: internal
  - id: term.production-work-condition-default-branch
    name: 作业条件默认分支
    definition: 条件节点唯一的否则分支；它不属于条件规则组、不保存条件 AST，在所有条件分支均未满足时作为后续出口。它与条件分支一样只能向后续流程节点输出，支持画布快捷添加；当前运行时回退和节点推进尚未实现。
    aliases: [否则分支, 默认出口]
    status: specified
    visibility: internal
  - id: term.production-work-applicability-rule
    name: 作业适用规则
    definition: 将一个作业模板应用于全局、指定生产范围或例外排除范围的配置规则。规则只能配置存在当前已发布作业流程版本的模板；无当前已发布流程的模板仍展示但不可选。优先级固定由 ruleType 派生，顺序为 EXCEPTION 例外排除、SCOPED 指定范围、GLOBAL 全局适用；优先级不是用户可输入、修改或选择的字段，客户页面不展示。未来运行期按该顺序自动匹配作业，不在产品或工序配置中手工引用；当前不表示生产运行时已经完成。
    aliases: [作业适用范围, 作业绑定规则, 作业适用规则类型]
    status: specified
    visibility: internal
  - id: term.production-work-instance
    name: 作业实例
    definition: 未来生产执行根据生产上下文和作业适用规则自动匹配后创建的运行对象。实例创建时冻结作业模板、已发布作业流程版本、命中的适用规则快照和作业流程配置快照，并基于冻结内容推进；当前尚未实现。
    aliases: [生产作业实例, 作业运行实例]
    status: specified
    visibility: internal
  - id: term.production-work-execution-snapshot
    name: 作业执行快照
    definition: 作业实例创建时形成的不可变执行依据，包含作业模板引用、创建时当前已发布作业流程版本引用、命中的作业适用规则快照和该已发布流程的作业流程配置快照；后续模板、规则和流程变更不回写既有快照。
    aliases: [作业快照, 作业实例快照]
    status: specified
    visibility: internal
  - id: term.action-handler
    name: 动作处理器
    definition: 按受控执行契约完成创建表单、更新状态、写入审计或调用外部系统等确定性副作用的标准处理器或项目插件。
    aliases: [业务动作处理器, 动作插件]
    status: specified
    visibility: internal
  - id: term.ai-delivery-pipeline
    name: Codex 协作交付流程
    definition: 团队使用 Codex 作为产品外部开发与交付工具时，通过仓库化协作契约、业务知识基线、业务决策、decisionPackage 和 Git 版本化资产保持多人对需求、规则、实现与质量标准理解一致的开发治理流程；它不是 eDHR 产品内的页面、服务或生产运行组件。
    aliases: [AI 辅助交付流程, Codex 二开交付流程]
    status: specified
    visibility: internal
  - id: term.requirement-impact-analysis
    name: 本体驱动需求影响分析
    definition: Codex 从已确认需求出发，沿结构化业务知识和实现证据识别直接、传递、潜在、不受影响及兼容迁移范围，并对证据不足的结论明确标记不确定性的研发分析活动。
    aliases: [需求影响分析, 本体驱动影响分析]
    status: specified
    visibility: internal
  - id: term.implementation-evidence-link
    name: 实现证据链接
    definition: 将业务概念、关系、规则、事件、动作或决策连接到领域模块、接口、持久化、页面、审计、测试、快照及下游投影等实现资产的可校验引用。
    aliases: [实现链接, 业务到代码证据链]
    status: specified
    visibility: internal
  - id: term.work-order
    name: 工单
    definition: 生产准备阶段的计划实体，保存必填工单编号、产品和计划数量，以及可选订单编号、计划起止时间、备注、可选或已锁定的产品制程版本、生产模式、生产形态和生命周期状态；创建后即处于 CREATED，可直接拆分多个生产对象，不存在 RELEASED 发布状态；生产执行中可主动提前结束并进入 EARLY_TERMINATED，区别于正常完成和行政关闭。
    aliases: [生产工单, 工单计划]
    status: specified
    visibility: internal
  - id: term.production-object
    name: 生产对象
    definition: 工单拆分后实际管理的批次或 SN 对象，保存对象编号、生产形态、锁定制程版本、目标数量、计划起止时间、备注、良品、NG、报废数量和对象生命周期状态。
    aliases: [批次对象, SN 对象, 工单对象]
    status: implemented
    visibility: internal
  - id: term.production-object-early-termination
    name: 生产对象提前结束
    definition: 生产对象处于进行中时由用户主动结束生产，不代表按完整制程正常完工；业务状态统一使用 EARLY_TERMINATED，并保留结束原因及其对活动执行事务、DHR 和工单状态计算的影响。当前 eDHR 已实现状态转移、结束原因和接口，但执行事务、DHR 和完整工单联动仍待补齐。
    aliases: [批次提前结束, 提前结束, early termination]
    status: specified
    visibility: internal
  - id: term.work-order-early-termination
    name: 工单提前结束
    definition: 工单处于生产中时由用户主动终止剩余生产，不代表全部对象按完整制程正常完成；业务状态统一使用 EARLY_TERMINATED，工单状态机转移及生产对象全部终态后的自动汇总已经实现。用户主动发起的工单级提前结束接口、结束原因，以及对未完成生产对象、活动执行事务和 DHR 的主动级联仍待实现。
    aliases: [生产工单提前结束, 工单强制结束, work order early termination]
    status: specified
    visibility: internal
  - id: term.production-object-lineage
    name: 生产对象父子追溯关系
    definition: 生产对象因批次再拆分、批次转 SN 或返工而形成的来源关系；子对象记录父对象和分配数量，保留制程执行依据、DHR、事务及审计追溯，使历史对象可以解释其来源和数量流向。
    aliases: [父子批次关系, 批次来源关系, 对象谱系]
    status: planned
    visibility: internal
  - id: term.production-batch-management-resplit
    name: 批次管理再拆分
    definition: 在批次管理页面对既有生产批次再次拆分的独立业务能力，与工单创建阶段的初始生产对象拆分分属不同弹窗和生命周期阶段；该能力不纳入当前 MVP，但数据模型需为后续 BATCH 转 BATCH、BATCH 转 SN 和返工子批次扩展保留父子追溯空间。
    aliases: [既有批次再拆分, 批次运营拆分, batch resplit]
    status: planned
    visibility: internal
  - id: term.work-order-production-object-split-dialog
    name: 工单生产对象拆分弹窗
    definition: 工单管理页面用于把工单计划数量首次准备为多个 BATCH 或 SN 生产对象的弹窗；候选对象先进入待提交清单，提交后写入生产对象，不负责既有批次的再次拆分。
    aliases: [工单拆分弹窗, 初始拆分弹窗]
    status: implemented
    visibility: internal
  - id: term.production-batch-resplit-dialog
    name: 批次管理再拆分弹窗
    definition: 批次管理页面用于对既有生产批次执行再次拆分的后续弹窗；它独立于工单生产对象拆分弹窗，需依据父批次状态、剩余可用数量和执行上下文创建子对象并展示父子追溯关系。当前仅保留产品边界和扩展规划，尚未实现。
    aliases: [批次再拆分弹窗, 批次管理拆分弹窗]
    status: planned
    visibility: internal
  - id: term.production-mode
    name: 生产模式
    definition: 当前首版工单与生产对象支持的生产模式，仅允许量产；其值从所选产品制程版本继承。
    aliases: [量产模式]
    status: implemented
    visibility: internal
  - id: term.production-form
    name: 生产形态
    definition: 产品制程版本定义的对象识别形态，当前只支持 BATCH 和 SN；同一工单的全部生产对象必须使用同一种形态。
    aliases: [批次形态, SN 形态, object type]
    status: implemented
    visibility: internal
  - id: term.batch
    name: 批次
    definition: 生产形态为 BATCH 的生产对象；其目标数量为大于零的数量值，可在工单计划数量范围内拆分。
    aliases: [生产批次]
    status: implemented
    visibility: internal
  - id: term.production-batch-management
    name: 批次管理页面
    definition: 生产准备阶段面向既有 BATCH 生产对象的列表页面；页面复用 ProductionObject 列表投影，支持整行打开详情以及在详情中查看该生产对象的数据审计，并由操作栏承载状态受限的业务动作。操作栏不提供重复的查看动作；未开工对象可取消，进行中对象可填写原因后提前结束，DHR、执行详情和流转单打印仅在对应生产执行能力可用时提供入口，不得伪造已实现数据。批次管理 MVP 不提供既有 BATCH 再拆分。
    aliases: [批次列表, 生产批次管理]
    status: implemented
    visibility: internal
  - id: term.production-object-execution-detail
    name: 生产对象执行详情
    definition: 从批次管理进入的生产对象执行上下文入口，用于查看生产执行阶段的工序、事务和执行记录；当前生产执行模块尚未实现，批次页面只能保留明确的待开放入口，不得伪造执行数据。
    aliases: [批次执行详情, 执行记录]
    status: planned
    visibility: internal
  - id: term.production-object-dhr-view
    name: 生产对象 DHR 查看
    definition: 从批次管理进入的生产对象 DHR 实例查看入口；DHR 实例应在生产对象首次开工时创建或激活，未开工、取消对象没有可查看的有效 DHR。当前 DHR 运行页面尚未实现。
    aliases: [批次 DHR, 批记录查看]
    status: planned
    visibility: internal
  - id: term.serial-number
    name: SN
    definition: 生产形态为 SN 的单件生产对象；首版要求每个 SN 对象的目标数量必须为 1。
    aliases: [序列号, 序号对象]
    status: implemented
    visibility: internal
  - id: term.data-audit-action-category
    name: 数据审计动作类别
    definition: 数据审计在客户页面展示的统一动作分类；生产工单及生产对象只投影“新增”和“修改”，生命周期动作不形成额外客户动作类别。
    aliases: [审计操作类别, 审计动作]
    status: implemented
    visibility: internal
  - id: term.production-object-pending-list
    name: 生产对象待提交清单
    definition: 生产对象手动添加、按数量批量添加或 CSV/XLS/XLSX 导入后，在真正持久化前暂存的候选记录集合；BATCH 导入候选需包含批次号和数量，SN 导入候选需包含 SN 编号，数量由生产形态隐含为 1，计划起止时间及备注可选，清单通过一次批量提交进入生产对象持久化。
    aliases: [批次待提交清单, SN待提交清单, 待添加生产对象]
    status: implemented
    visibility: internal
  - id: term.production-object-batch-submission
    name: 生产对象批量提交
    definition: 将待提交清单中的多个生产对象候选记录一次性提交到服务端事务边界内的标准动作；任一记录校验或持久化失败时整批不应留下部分成功结果。
    aliases: [批次批量添加, 批量拆分生产对象]
    status: implemented
    visibility: internal
  - id: term.production-batch-import-template
    name: 生产对象导入模板（批次/SN）
    definition: 生产对象导入使用的固定列集合；BATCH 形态要求批次号和数量，SN 形态只要求 SN 编号，SN 数量由生产形态隐含为 1，计划开始时间、计划结束时间和备注均为可选字段，支持 CSV、XLS、XLSX 文件。
    aliases: [批次导入模板, SN导入模板, 生产对象导入模板]
    status: implemented
    visibility: internal
  - id: term.process-version-read-only-preview
    name: 制程版本只读预览
    definition: 已关联工单制程版本在拆分阶段的只读引用与详情查看能力；不可改写版本选择，可查看版本元数据、工艺路线、批记录模板和工序配置。
    aliases: [制程版本预览, 锁定制程预览]
    status: implemented
    visibility: internal
  - id: term.audit-change-snapshot
    name: 审计变更快照
    definition: 数据审计事件中用于追溯业务变化的变更前和变更后业务字段快照；创建事件的变更前快照为空对象，更新、取消和关闭事件均应保存真实持久化对象变化前后的字段，不得使用方法参数伪造快照。快照持久化继续使用稳定内部字段和值，客户界面通过共享生产审计映射将已知字段、状态、生产形态和时间转换为中文业务展示；该转换不得改写原始快照或其证据完整性。
    aliases: [变更前后快照, 审计字段快照]
    status: implemented
    visibility: internal
